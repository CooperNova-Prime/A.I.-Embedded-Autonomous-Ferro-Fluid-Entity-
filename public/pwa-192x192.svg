<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a121c"/>
      <stop offset="70%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0088cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#664400"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#005588"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Outer Ambient Aura -->
  <circle cx="256" cy="256" r="210" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Gimbal Rings -->
  <!-- Ring 4: Halo -->
  <ellipse cx="256" cy="256" rx="200" ry="85" fill="none" stroke="url(#cyanArc)" stroke-width="3" opacity="0.6" transform="rotate(-25 256 256)"/>
  
  <!-- Ring 3: Outer Gold Mid -->
  <ellipse cx="256" cy="256" rx="170" ry="70" fill="none" stroke="url(#goldRing)" stroke-width="4.5" transform="rotate(35 256 256)"/>

  <!-- Ring 2: Pitch Ring -->
  <ellipse cx="256" cy="256" rx="140" ry="55" fill="none" stroke="url(#cyanArc)" stroke-width="4" transform="rotate(-65 256 256)"/>

  <!-- Ring 1: Equatorial Ring -->
  <ellipse cx="256" cy="256" rx="115" ry="40" fill="none" stroke="url(#goldRing)" stroke-width="5"/>

  <!-- Central Ferrofluid Core Sphere -->
  <circle cx="256" cy="256" r="75" fill="#040609" stroke="#00f0ff" stroke-width="2.5"/>

  <!-- Dynamic Rosensweig Spikes -->
  <path d="M 256 160 Q 256 175 256 181" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 256 352 Q 256 337 256 331" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 160 256 Q 175 256 181 256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 352 256 Q 337 256 331 256" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
  
  <path d="M 188 188 Q 200 200 208 208" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
  <path d="M 324 324 Q 312 312 304 304" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
  <path d="M 324 188 Q 312 200 304 208" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>
  <path d="M 188 324 Q 200 312 208 304" stroke="#ffd700" stroke-width="5" stroke-linecap="round"/>

  <!-- Acoustic VUI Ripple Rings on Front Body -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="32" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.9"/>
  <circle cx="256" cy="256" r="16" fill="#00f0ff" opacity="0.95"/>
</svg>
